<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>网站后台｜祝雪峰教授</title>
  <link rel="stylesheet" href="admin.css">
</head><body>
  <main class="login-shell" id="login-view"><form class="login-card" id="login-form"><div class="badge">祝</div><h1>网站内容管理</h1><p>祝雪峰教授个人学术主页</p><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button><div class="message" id="login-message"></div></form></main>
  <div class="admin-shell hidden" id="admin-view"><aside><a class="brand" href="../"><b>祝</b><span>学术主页后台</span></a><nav><button class="active" data-kind="publications">出版物</button><button data-kind="conferences">会议</button><button data-kind="software">软件</button><button data-kind="articles">文章</button></nav><button class="logout" id="logout">退出登录</button></aside>
  <main class="workspace"><header><div><span class="eyebrow">CONTENT MANAGER</span><h1 id="section-title">出版物</h1></div><button class="primary" id="new-item">＋ 新建内容</button></header><div class="toolbar"><input id="admin-search" placeholder="搜索当前栏目"><span id="count"></span></div><div id="records"></div></main></div>
  <dialog id="editor"><form method="dialog" id="editor-form"><header><h2>编辑内容</h2><button value="cancel" class="close">×</button></header><input type="hidden" name="id"><div class="form-grid"><label>语言<select name="locale"><option value="zh">中文</option><option value="en">English</option></select></label><label>年份<input name="year" type="number"></label><label>类型<input name="type" required></label><label class="wide">标题<input name="title" required></label><label class="wide">作者<input name="authors"></label><label class="wide">期刊 / 会议 / 说明<input name="venue"></label><label>日期<input name="date"></label><label>排序<input name="sort_order" type="number" value="0"></label><label class="wide">摘要<textarea name="abstract" rows="4"></textarea></label><label class="wide">图片或文件网址<div class="upload-line"><input name="image_url"><input id="file-input" type="file" accept=".png,.jpg,.jpeg,.gif,.webp,.svg,.pdf,.doc,.docx,.ppt,.pptx"><button type="button" id="upload">上传</button></div></label><label class="wide">相关链接（JSON）<textarea name="links" rows="3" placeholder='[{"label":"DOI","url":"https://..."}]'></textarea></label><label class="check"><input name="featured" type="checkbox"> 首页精选</label></div><footer><button value="cancel" class="secondary">取消</button><button type="submit" value="default" class="primary">保存</button></footer><div class="message" id="editor-message"></div></form></dialog>
  <script src="admin.js"></script>
</body></html>
