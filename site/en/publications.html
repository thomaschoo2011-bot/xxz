<!doctype html>
<html lang="en">
  <head>
    <meta name="robots" content="index,follow,max-snippet:-1" />
    <link rel="canonical" href="https://xuefengzhu.com/en/publications.html" />
    <link rel="alternate" hreflang="en" href="https://xuefengzhu.com/en/publications.html" />
    <link rel="alternate" hreflang="zh-CN" href="https://xuefengzhu.com/publications.html" />
    <meta property="og:title" content="Professor Xuefeng Zhu — Publications" />
    <meta property="og:url" content="https://xuefengzhu.com/en/publications.html" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Publications by Professor Xuefeng Zhu" />
    <title>Publications | Professor Xuefeng Zhu</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main id="main">
      <section class="page-hero">
        <div class="container">
          <span class="kicker">Research Output</span>
          <h1>Publications</h1>
          <p class="intro">
            This English bibliography includes records whose English titles,
            author names, and publication venues have been verified against
            registered scholarly metadata. For the complete publication list,
            see the
            <a href="../publications.html">Chinese publications page</a>.
          </p>
        </div>
      </section>
      <section class="filters">
        <div class="container">
          <div class="search">
            <input
              id="search"
              type="search"
              placeholder="Search by title, author, or journal"
              aria-label="Search publications"
            />
          </div>
          <div class="filter-row">
            <div class="field">
              <label for="year-filter">Year</label
              ><select id="year-filter"></select>
            </div>
            <div class="field">
              <label for="type-filter">Type</label
              ><select id="type-filter"></select>
            </div>
          </div>
          <div class="topic-row">
            <span>Research field</span>
            <div class="topic-filter" id="topic-filter" aria-label="Filter by research field"></div>
          </div>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <p class="result-note"><b id="result-count">0</b> results</p>
          <div class="record-list" id="record-list"></div>
        </div>
      </section>
    </main>
    <script src="content-en.js"></script>
    <script src="app-en.js"></script>
    <script>
      AcademicSite.renderListing("publications");
    </script>
  </body>
